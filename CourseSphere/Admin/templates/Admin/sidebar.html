{% load static %}
<aside class="glass-admin-sidebar d-flex flex-column h-100">
    <!-- Admin User Profile Banner -->
    <div class="sidebar-brand d-flex align-items-center gap-3">
        <div style="width:44px; height:44px; border-radius:14px; background:linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%); display:flex; align-items:center; justify-content:center; color:#fff; font-size:1.3rem; box-shadow:0 4px 14px rgba(14, 165, 233, 0.4); flex-shrink:0;">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <div class="overflow-hidden">
            <h6 class="fw-bold text-white mb-0 text-truncate" style="font-size: 0.95rem;">{{ user.username }}</h6>
            <span class="badge" style="background:rgba(56, 189, 248, 0.18); color:#38bdf8; font-size:0.68rem; letter-spacing:0.05em; font-weight:700;">ADMIN PANEL</span>
        </div>
    </div>

    <!-- Navigation Section -->
    <div class="sidebar-heading">Navigation</div>
    <ul class="glass-sidebar-nav mb-3">
        <li>
            <a href="{% url 'admin_portal:admin_dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
            </a>
        </li>
    </ul>

    <!-- Course Management Section -->
    <div class="sidebar-heading">Course Management</div>
    <ul class="glass-sidebar-nav mb-3">
        <li>
            <a href="{% url 'admin_portal:add_course' %}" class="nav-link {% if request.resolver_match.url_name == 'add_course' %}active{% endif %}">
                <i class="bi bi-plus-circle-fill"></i>
                <span>Add Course</span>
            </a>
        </li>
        <li>
            <a href="{% url 'admin_portal:course_list' %}" class="nav-link {% if request.resolver_match.url_name == 'course_list' %}active{% endif %}">
                <i class="bi bi-journal-text"></i>
                <span>All Courses</span>
            </a>
        </li>
    </ul>

    <!-- Sidebar Footer -->
    <div class="glass-sidebar-footer mt-auto pt-3">
        <ul class="glass-sidebar-nav">
            <li>
                <a href="{% url 'admin_portal:admin_logout' %}" class="nav-link nav-logout">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Log Out</span>
                </a>
            </li>
        </ul>
    </div>
</aside>
